# Every PR: lint, rebuild every task CI can build (all but the panel families' held-out split, whose
# seeds are secret; train at the size the manifests record), run the test suite, then fail if the
# rebuild changes a committed manifest. The Harbor oracle run in Docker is oracle.yml (nightly, on demand).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"      # requirements.txt was verified with 3.14.3
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check

      - name: Build tasks
        run: python rl/build.py research_design kpi_nowcast panel --split bench

      - name: Build the generated families' train split (the size the committed manifests record)
        run: python rl/build.py panel --split train --n 3 --controls 1

      - name: Tests
        run: pytest

      - name: Rebuild reproduces the committed manifests
        run: |
          if ! git diff --exit-code --stat -- rl/splits/manifests; then
            echo "::error::Rebuilding changed rl/splits/manifests/. Either the change altered tasks unintentionally, or the PR needs the rebuilt manifests committed (python rl/build.py, held-out included, then commit)."
            git diff -- rl/splits/manifests | head -100
            exit 1
          fi
