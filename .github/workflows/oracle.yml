# Nightly and on demand: Harbor's oracle agent runs the reference solution of a bench sample in each
# task's own Docker image, and the verifier's reward there must match the local reference reward
# pytest pins (rl/harness/oracle_check.py). Catches what the local runs can't: a package version
# the image pins differently, a file the image lacks, a path only the container has.
name: Oracle

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JUDGE: keyword          # growth_thesis memos graded offline, as the pinned rewards were
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Build bench tasks
        run: python rl/build.py panel --split bench

      - name: Oracle in Docker matches the local reference
        run: python rl/harness/oracle_check.py
