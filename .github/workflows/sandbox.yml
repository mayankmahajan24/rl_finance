# Point-in-time sandbox: run a sample of built tasks through Harbor in Docker with an agent that only
# tries to reach the internet and read the clock (rl/harness/sandbox_probe.py). Harbor's Docker
# egress control needs nftables fib inet in the host kernel: GitHub's Ubuntu runners have it, Docker
# Desktop's VM does not (there Harbor refuses no-network tasks rather than run them open).
name: Sandbox probe

on:
  pull_request:
    paths:
      - rl/families/_shared/harbor.py
      - rl/families/*/build.py
      - rl/harness/sandbox_probe.py
      - requirements.txt
      - .github/workflows/sandbox.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Build tasks
        run: python rl/build.py research_design kpi_nowcast panel --split bench

      - name: Agent phase has no network; dated task's clock reads as_of; the judge is still reachable
        run: python rl/harness/sandbox_probe.py --with-judge rl/tasks/bench/kn-produce-AIR02-2017Q4-anon

      - name: Agent phase has no network (one task per other family)
        run: >-
          python rl/harness/sandbox_probe.py rl/tasks/bench/audit-bench-001 rl/tasks/bench/anomaly-bench-001
          rl/tasks/bench/thesis-bench-001 rl/tasks/eval/rd-review-S1-A
