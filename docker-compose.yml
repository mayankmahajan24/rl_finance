services:
  # One-shot eval runner. Override the command to pick a suite/provider, e.g.
  #   docker compose run --rm eval run --suite fixed_income --provider mock
  #   docker compose run --rm eval run --suite earnings --provider anthropic
  eval:
    build: .
    image: finrl-eval:local
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - ./runs:/app/runs
    command: ["run", "--suite", "earnings", "--provider", "mock"]

  # Full offline pipeline: unit tests, then every live suite on the mock provider.
  pipeline:
    build: .
    image: finrl-eval:local
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./runs:/app/runs
    command:
      - |
        set -eu
        python -m pytest -q
        for suite in $(finrl-eval runnable); do
          finrl-eval run --suite "$suite" --provider mock --quiet
        done
        ls -1 runs
