# Package metadata for the checkout: `pip install -e .` installs the pinned dependencies and the
# console entry points (rl_finance_cli.py). The rl/ scripts still run from the checkout itself.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-finance"
version = "0.1.0"
description = "RL environments and evals for buy-side financial services"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
rl-build = "rl_finance_cli:build"
rl-check = "rl_finance_cli:check"
rl-export = "rl_finance_cli:export"
rl-run = "rl_finance_cli:run"

[tool.setuptools]
py-modules = ["rl_finance_cli"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.pytest.ini_options]
testpaths = ["rl/tests"]
pythonpath = ["rl", "rl/harness", "rl/review"]
addopts = "-ra"
markers = ["slow: runs solvers end to end (seconds per task)"]

[tool.ruff]
extend-exclude = ["rl/vendor", "rl/tasks"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Copied into every anomaly_scoring task: editing it changes every task's content_sha256, held-out
# included. Remove the unused import with the family's next version bump.
"rl/families/anomaly_scoring/verifier/anomaly_verify.py" = ["F401"]
