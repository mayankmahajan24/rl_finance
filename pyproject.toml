[project]
name = "finrl-eval"
version = "0.1.0"
description = "Finance RL: evaluation framework and pipeline for measuring frontier-model performance on high-stakes financial tasks, with outputs usable as RL reward signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
finrl-eval = "finrl_eval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finrl_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["case_study", "rl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
