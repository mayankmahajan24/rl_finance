id: anomaly_scoring
task_prefix: anomaly
description: Online (no-foresight) anomaly scoring of sensor data
version: 3.0.0          # bump when the family's tasks change in a way results can't be compared across
authors:
  - name: Mayank Mahajan
role: [quant_researcher]
workflow: [anomaly_scoring]
mode: [produce]            # the deliverable is code: /app/solution/score.py
world: [systematic_consumer]
source: txn_panel
format: harbor
tools: [code_execution]
builder: families._shared.build_panel   # generator: generate.py
verifier: verifier/anomaly_verify.py
verifier_timeout_sec: 3600
gold_file: gold.json
reward: F1 on a hidden panel's planted spikes, drops and level shifts x coverage, zeroed if the no-foresight check fails
gold_inputs:             # files its gold comes from; each has a provenance entry (rl/provenance.py)
  - sources/txn_panel/annotations/data_artifacts.yaml
  - sources/txn_panel/annotations/entities.yaml
  - families/anomaly_scoring/generate.py
  - families/_shared/panel_perturb.py
instrument:              # what decides what the model sees and how it is scored; live use needs its hash
                         # approved (rl/instrument.py, rl/harness/approve.py)
  - families/anomaly_scoring/instruction.md
  - families/anomaly_scoring/generate.py
  - families/anomaly_scoring/verifier/anomaly_verify.py
  - families/_shared/build_panel.py
  - families/_shared/panel_perturb.py
  - families/_shared/panel_schema.md
  - families/_shared/firm.md
  - families/_shared/panel_copy_note.md
  - sources/txn_panel/panel.py
calibration:             # scored metric and pass threshold for rl/harness/calibrate.py; proposed, Mayank to confirm
  metric: reward
  pass: 0.5
  ceiling_note: real but unlabelled anomalies in the panel count as false positives, so the best achievable F1 is below 1
leak_check:              # ground truth is structural: planted problems are tickers and dates that are in the data by
                         # construction, so there is no gold text or number to search for (rl/leakcheck.py)
  anonymised: all          # every task is disguised: no real company name, ticker or series id
