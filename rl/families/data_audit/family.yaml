id: data_audit
task_prefix: audit
description: Audit an alt-data panel for planted data-quality problems
version: 0.1.0          # bump when the family's tasks change in a way results can't be compared across
authors:
  - name: Mayank Mahajan
role: [quant_researcher]
workflow: [data_audit]
mode: [review]             # find what is wrong with given material: issues.json + writeup.md
world: [systematic_consumer]
source: txn_panel
format: harbor
tools: [code_execution]
builder: families._shared.build_panel   # generator: generate.py
verifier: verifier/audit_verify.py
verifier_timeout_sec: 600
gold_file: gold.json
reward: >-
  F1 of precision and recall against planted problems plus required natural breaks (code, no judge).
  Never blended in: the W1-W9 write-up rubric (LLM judge; left out when the judge can't run)
rubric_visibility: partial  # the instruction asks for the note but not the rubric's judgment items; draft rubric,
                            # Mayank to confirm
judge:                   # the write-up judge (judge.md); pinned, part of the instrument (families/_shared/judge.py)
  model: claude-sonnet-5-5
  effort: medium
  votes: 1
  max_tokens: 8000
gold_inputs:             # files its gold comes from; each has a provenance entry (rl/provenance.py)
  - sources/txn_panel/annotations/data_artifacts.yaml
  - sources/txn_panel/annotations/entities.yaml
  - families/data_audit/generate.py
  - families/_shared/panel_perturb.py
  - families/data_audit/judge.md
instrument:              # what decides what the model sees and how it is scored; live use needs its hash
                         # approved (rl/instrument.py, rl/harness/approve.py)
  - families/data_audit/instruction.md
  - families/data_audit/generate.py
  - families/data_audit/verifier/audit_verify.py
  - families/data_audit/judge.md
  - families/_shared/writeup.py
  - families/_shared/build_panel.py
  - families/_shared/panel_perturb.py
  - families/_shared/panel_schema.md
  - families/_shared/firm.md
  - families/_shared/panel_copy_note.md
  - sources/txn_panel/panel.py
  - families/data_audit/family.yaml       # pins the judge
calibration:             # scored metric and pass threshold for rl/harness/calibrate.py; proposed, Mayank to confirm
  metric: reward
  pass: 0.8
leak_check:              # ground truth is structural: planted problems are tickers and dates that are in the data by
                         # construction, so there is no gold text or number to search for (rl/leakcheck.py)
  anonymised: all          # every task is disguised: no real company name, ticker or series id
