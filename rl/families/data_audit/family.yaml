id: data_audit
task_prefix: audit
description: Audit an alt-data panel for planted data-quality problems
version: 1.1.0          # bump when the family's tasks change in a way results can't be compared across
authors:
  - name: Mayank Mahajan
    email: mayank.mahajan@gmail.com
role: quant_researcher
workflow: data_audit
mode: review             # find what is wrong with given material
world: ls_altdata
source: txn_panel
format: harbor
companies: panel         # the task's data is the split's companies' real (disguised) panel
generator: generate.py
verifier: verifier/audit_verify.py
verifier_timeout_sec: 600
reward: F1 of precision and recall against planted problems plus required natural breaks
gold_inputs:             # files its gold comes from; each has a provenance entry (rl/provenance.py)
  - sources/txn_panel/annotations/data_artifacts.yaml
  - sources/txn_panel/annotations/entities.yaml
  - families/data_audit/generate.py
  - families/_shared/panel_perturb.py
