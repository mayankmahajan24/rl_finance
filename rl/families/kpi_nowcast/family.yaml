id: kpi_nowcast
task_prefix: kn
description: Nowcast a company's quarterly KPI from the transaction-sensor panel and its filed actuals
version: 2.0.0          # bump when the family's tasks change in a way results can't be compared across
authors:
  - name: Mayank Mahajan
role: [quant_researcher]
workflow: [kpi_nowcast]
mode: [produce]          # write-up + forecast JSON
world: [ls_altdata]
source: txn_panel
format: harbor
dated: true              # every task has an as_of; the container clock is pinned to it (splits/check.py)
builder: families.kpi_nowcast.build   # case: series and quarter; its named and anonymised variants share a split
runner: run.py           # API runner with code execution; refuses live runs until the instrument is approved (approval.yaml)
verifier: verifier/verify.py
verifier_timeout_sec: 600
gold_file: gold.json
reward: >-
  skill_vs_naive clamped to [0, 1] (0 = no better than last year's seasonal step, 1 = exact; code, no judge).
  Diagnostics, never blended in: abs % error, coverage, interval score (code) and the C1-C12 write-up
  rubric (LLM judge; left out when the judge can't run)
rubric_visibility: partial  # the instruction states the fund's write-up conventions (headline estimate, range
                            # and units first; in-sample accuracy next to a simple benchmark; low <= point <= high)
                            # but not the judgment items (C2-C5, C7, C9, C11, C12): models are graded on whether
                            # they do what a careful analyst would, unprompted. Deliberate.
judge:                   # the write-up judge (judge.md); pinned, part of the instrument (families/_shared/judge.py)
  model: claude-sonnet-5-5
  effort: medium
  votes: 1
  max_tokens: 8000
gold_inputs:             # files its gold comes from; each has a provenance entry (rl/provenance.py)
  - sources/txn_panel/grader_only/kpi_facts.csv
  - sources/txn_panel/grader_only/kpi_quarterly.csv
  - sources/txn_panel/annotations/company_facts.yaml
  - sources/txn_panel/annotations/entities.yaml
  - families/kpi_nowcast/judge.md
instrument:              # what decides what the model sees and how it is scored; live use needs its hash
                         # approved (rl/instrument.py, rl/harness/approve.py)
  - families/kpi_nowcast/build.py
  - families/kpi_nowcast/run.py
  - families/kpi_nowcast/grader.py
  - families/kpi_nowcast/judge.md
  - families/kpi_nowcast/prompts/*.md
  - families/kpi_nowcast/schema.json
  - families/kpi_nowcast/verifier/verify.py
  - sources/txn_panel/panel.py
  - families/_shared/harbor.py
  - families/_shared/judge.py
  - families/kpi_nowcast/family.yaml       # pins the judge
  - families/_shared/verify_common.py
calibration:             # scored metric and pass threshold for rl/harness/calibrate.py; proposed, Mayank to confirm
  metric: reward
  pass: 0.01               # passing means beating the naive forecast
leak_check:              # gold fields that must never appear where the agent can see them (rl/leakcheck.py)
  gold_numbers:
    gold.json: [actual]
  number_exempt: [sensor_panel.csv]   # daily counts and dollars: a bare long number there is coincidence
  anonymised:              # anon variants: no real name, ticker or series id of the task's company
    tag: anon
    exempt: [data_brief.md]  # the vendor's note on the sensors, the same for every task
