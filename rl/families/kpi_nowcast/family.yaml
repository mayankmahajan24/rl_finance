id: kpi_nowcast
task_prefix: kn
description: Choose the company metric the transaction-sensor panel tracks best and nowcast it from the panel and the filed income statement
version: 4.0.0          # bump when the family's tasks change in a way results can't be compared across
authors:
  - name: Mayank Mahajan
role: [quant_researcher]
workflow: [kpi_nowcast]
mode: [produce]          # write-up + forecast JSON
world: [systematic_consumer]
source: txn_panel
format: harbor
tools: [code_execution]
dated: true              # every task has an as_of; the container clock is pinned to it (splits/check.py)
builder: families.kpi_nowcast.build   # case: series and quarter; its three variants share a split
verifier: verifier/verify.py
verifier_timeout_sec: 600
gold_file: gold.json
reward: >-
  0 unless metric_history shows the task's metric (the gold KPI) was chosen; then skill_vs_naive clamped to
  [0, 1] (0 = no better than last year's seasonal step, 1 = exact; code), scaled by 0.5 + 0.5 x the
  C1-C38 write-up score (LLM judge, over the brief and the methods note), so the write-up moves the reward by at most half and can't earn it
  alone. Accuracy only when the judge can't run (details say so). Diagnostics: abs % error, coverage,
  interval score (code) and each rubric item
rubric_visibility: partial  # the instruction states the fund's write-up conventions (headline estimate, range
                            # and units first, with Y/Y growth, in a plain-language brief; a methods note that states what
                            # was modelled on what, coefficients and significance; walk-forward error next to a simple
                            # benchmark; the brief agrees with the note and leaves the metric choice to it; low <= point <= high)
                            # but not the judgment items (C3, C6-C15, C17-C22, C24-C29, C31, C34-C38): models are graded on whether
                            # they do what a careful analyst would, unprompted. Deliberate.
judge:                   # the write-up judge (judge.md); pinned, part of the instrument (families/_shared/judge.py)
  model: claude-sonnet-5-5
  effort: medium
  votes: 1
  max_tokens: 8000
gold_inputs:             # files its gold comes from; each has a provenance entry (rl/provenance.py)
  - sources/txn_panel/grader_only/kpi_facts.csv
  - sources/txn_panel/grader_only/kpi_quarterly.csv
  - sources/txn_panel/annotations/company_facts.yaml
  - sources/txn_panel/annotations/entities.yaml
  - families/kpi_nowcast/judge.md
instrument:              # what decides what the model sees and how it is scored; live use needs its hash
                         # approved (rl/instrument.py, rl/harness/approve.py)
  - families/kpi_nowcast/build.py
  - families/kpi_nowcast/grader.py
  - families/kpi_nowcast/judge.md
  - families/kpi_nowcast/prompts/*.md
  - families/_shared/firm.md
  - families/kpi_nowcast/schema.json
  - families/kpi_nowcast/verifier/verify.py
  - sources/txn_panel/panel.py
  - sources/txn_panel/assignment/brief.txt
  - families/kpi_nowcast/family.yaml       # pins the judge
calibration:             # scored metric and pass threshold for rl/harness/calibrate.py; proposed, Mayank to confirm
  metric: reward
  pass: 0.33               # skill 1/3: the forecast's error is at most half the naive forecast's
leak_check:              # gold fields that must never appear where the agent can see them (rl/leakcheck.py)
  gold_numbers:
    gold.json: [actual]
  number_exempt: [transaction_panel.csv]   # daily counts and dollars: a bare long number there is coincidence
  anonymised:              # disguised variants: no real name, ticker or series id of the task's company
    tags: [coded, anon]
    exempt: [data_brief.md]  # the panel description; names no company
