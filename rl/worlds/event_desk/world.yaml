id: event_desk
name: Event-driven pod on a multi-manager platform
kind: fund
status: brief_only
brief: A single-name event-driven desk inside a multi-manager platform. One PM, two analysts. Horizon
  is weeks to a few months around a catalyst. Deep primary-source and legal-document work, expert networks,
  and a risk manager who cuts positions fast. No quantitative research staff and no capacity to build
  datasets; they consume sell-side, filings, and expert calls. The question is always whether this specific
  situation is mispriced right now, not whether an effect holds on average.
