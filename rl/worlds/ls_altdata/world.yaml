id: ls_altdata
name: Long/short fund with a new European transaction panel
kind: fund
status: brief_only
brief: 'A mid-size long/short equity fund that has just licensed a European retail transaction panel.
  ~30 investment staff, a three-person data team that cleans alt-data panels, and one engineer. Horizon
  is six to eighteen months. They want to take positions in specific listed European banks and to use
  the panel to underwrite them — deposit flows, salary capture, customer acquisition, attrition. The obstacle
  is that the panel''s institution IDs are anonymized: until an ID is matched to a bank, none of the behavioral
  data can be attached to a ticker. What kills the work is a confident wrong match, because the desk would
  then be sizing a position on another bank''s customers. Must be defensible to a PM who will ask what
  would have to be true for it to be wrong.'
case_study_items:
- S3
to_become_a_full_world:
- mandate and risk limits
- current holdings with sizes
- investment theses per position
- past research memos and IC notes
- point-in-time data snapshot and tool access
