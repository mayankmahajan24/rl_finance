id: small_lo
name: Small concentrated long-only manager
kind: fund
status: brief_only
brief: A five-person old-school long-only manager, ~$400M AUM, 25-30 concentrated positions held three
  to five years. Two PMs, two analysts, one operations person. Tooling is Bloomberg, Excel, and filings;
  there are no engineers and no data scientists, and nobody here maintains a database. They buy research
  and datasets occasionally but cannot operate infrastructure. What kills them is being wrong about a
  business, not transaction costs. Anything proposed must be executable by one analyst and defensible
  to an investment committee that is skeptical of models it cannot inspect.
